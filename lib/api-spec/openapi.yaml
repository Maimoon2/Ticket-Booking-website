openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: ScenePass ticket booking API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: auth
  - name: events
  - name: bookings
  - name: waitlist
  - name: organiser
  - name: admin
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/register:
    post:
      operationId: register
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "409": { $ref: "#/components/responses/Conflict" }
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }
  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401": { $ref: "#/components/responses/Unauthorized" }
  /events:
    get:
      operationId: listEvents
      tags: [events]
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: category, in: query, schema: { type: string, enum: [MOVIE, CONCERT] } }
        - { name: date, in: query, schema: { type: string } }
      responses:
        "200":
          description: Events
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Event" }
    post:
      operationId: createEvent
      tags: [events]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EventInput" }
      responses:
        "201":
          description: Created event
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Event" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /events/{id}:
    get:
      operationId: getEvent
      tags: [events]
      parameters:
        - { $ref: "#/components/parameters/Id" }
      responses:
        "200":
          description: Event
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventDetail" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateEvent
      tags: [events]
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/Id" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EventUpdate" }
      responses:
        "200":
          description: Updated event
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Event" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /events/{id}/seats:
    get:
      operationId: getEventSeats
      tags: [events]
      parameters:
        - { $ref: "#/components/parameters/Id" }
      responses:
        "200":
          description: Live seat map
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/EventSeat" }
  /events/{id}/holds:
    post:
      operationId: createHold
      tags: [bookings]
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/Id" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HoldInput" }
      responses:
        "201":
          description: Held seats
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Hold" }
        "409": { $ref: "#/components/responses/Conflict" }
  /holds/{id}:
    get:
      operationId: getHold
      tags: [bookings]
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/Id" }
      responses:
        "200":
          description: Hold
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Hold" }
        "410": { $ref: "#/components/responses/Gone" }
  /holds/{id}/checkout:
    post:
      operationId: checkout
      tags: [bookings]
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/Id" }
      responses:
        "201":
          description: Booking created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Booking" }
        "409": { $ref: "#/components/responses/Conflict" }
        "410": { $ref: "#/components/responses/Gone" }
  /bookings:
    get:
      operationId: listBookings
      tags: [bookings]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Customer bookings
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Booking" }
  /bookings/{id}:
    get:
      operationId: getBooking
      tags: [bookings]
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/Id" }
      responses:
        "200":
          description: Booking ticket
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Booking" }
        "404": { $ref: "#/components/responses/NotFound" }
  /bookings/{id}/cancel:
    post:
      operationId: cancelBooking
      tags: [bookings]
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/Id" }
      responses:
        "200":
          description: Cancelled booking
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Booking" }
        "409": { $ref: "#/components/responses/Conflict" }
  /waitlist:
    get:
      operationId: listWaitlist
      tags: [waitlist]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Waitlist entries and active offers
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/WaitlistEntry" }
    post:
      operationId: joinWaitlist
      tags: [waitlist]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WaitlistInput" }
      responses:
        "201":
          description: Joined waitlist
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WaitlistEntry" }
        "409": { $ref: "#/components/responses/Conflict" }
  /waitlist/offers:
    get:
      operationId: listWaitlistOffers
      tags: [waitlist]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Offers
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/WaitlistOffer" }
  /waitlist/offers/{id}/claim:
    post:
      operationId: claimWaitlistOffer
      tags: [waitlist]
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/Id" }
      responses:
        "200":
          description: Claimed offer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WaitlistOffer" }
        "410": { $ref: "#/components/responses/Gone" }
  /organiser/events:
    get:
      operationId: listOrganiserEvents
      tags: [organiser]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Organiser events
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Event" }
  /organiser/events/{id}/analytics:
    get:
      operationId: getEventAnalytics
      tags: [organiser]
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/Id" }
      responses:
        "200":
          description: Event analytics
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Analytics" }
  /venues:
    get:
      operationId: listVenues
      tags: [admin]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Venues
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Venue" }
    post:
      operationId: createVenue
      tags: [admin]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VenueInput" }
      responses:
        "201":
          description: Venue created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Venue" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /venues/{id}:
    get:
      operationId: getVenue
      tags: [admin]
      parameters:
        - { $ref: "#/components/parameters/Id" }
      responses:
        "200":
          description: Venue
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VenueDetail" }
    patch:
      operationId: updateVenue
      tags: [admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/Id" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VenueUpdate" }
      responses:
        "200":
          description: Updated venue
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Venue" }
    delete:
      operationId: deleteVenue
      tags: [admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/Id" }
      responses:
        "204": { description: Deleted }
  /venues/{id}/seats:
    post:
      operationId: createVenueSeat
      tags: [admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/Id" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SeatInput" }
      responses:
        "201":
          description: Seat created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Seat" }
  /dashboard:
    get:
      operationId: getAdminDashboard
      tags: [admin]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Platform dashboard
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Analytics" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Insufficient role
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: Conflict
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Gone:
      description: Expired resource
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    HealthStatus:
      type: object
      properties: { status: { type: string } }
      required: [status]
    Error:
      type: object
      properties: { error: { type: string }, code: { type: string } }
      required: [error]
    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        role: { type: string, enum: [CUSTOMER, ORGANISER, ADMIN] }
      required: [id, name, email, role]
    RegisterInput:
      type: object
      properties:
        name: { type: string, minLength: 2 }
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
        role: { type: string, enum: [CUSTOMER, ORGANISER] }
      required: [name, email, password]
    LoginInput:
      type: object
      properties:
        email: { type: string, format: email }
        password: { type: string }
      required: [email, password]
    AuthResponse:
      type: object
      properties:
        token: { type: string }
        user: { $ref: "#/components/schemas/User" }
      required: [token, user]
    Venue:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        address: { type: string }
        city: { type: string }
        capacity: { type: integer }
        seatCount: { type: integer }
      required: [id, name, address, city, capacity, seatCount]
    VenueDetail:
      allOf:
        - { $ref: "#/components/schemas/Venue" }
        - type: object
          properties:
            seats:
              type: array
              items: { $ref: "#/components/schemas/Seat" }
    VenueInput:
      type: object
      properties:
        name: { type: string, minLength: 2 }
        address: { type: string }
        city: { type: string }
      required: [name, address, city]
    VenueUpdate:
      type: object
      properties:
        name: { type: string }
        address: { type: string }
        city: { type: string }
    Seat:
      type: object
      properties:
        id: { type: string, format: uuid }
        label: { type: string }
        row: { type: string }
        number: { type: integer }
        category: { type: string, enum: [PREMIUM, STANDARD] }
        price: { type: number }
      required: [id, label, row, number, category, price]
    SeatInput:
      type: object
      properties:
        row: { type: string }
        number: { type: integer }
        category: { type: string, enum: [PREMIUM, STANDARD] }
        price: { type: number }
      required: [row, number, category, price]
    Event:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        category: { type: string, enum: [MOVIE, CONCERT] }
        description: { type: string }
        imageUrl: { type: ["string", "null"] }
        startsAt: { type: string, format: date-time }
        venue: { $ref: "#/components/schemas/Venue" }
        minPrice: { type: number }
        availableSeats: { type: integer }
      required: [id, title, category, description, startsAt, venue, minPrice, availableSeats]
    EventInput:
      type: object
      properties:
        title: { type: string }
        category: { type: string, enum: [MOVIE, CONCERT] }
        description: { type: string }
        imageUrl: { type: string }
        startsAt: { type: string, format: date-time }
        venueId: { type: string, format: uuid }
        premiumPrice: { type: number }
        standardPrice: { type: number }
      required: [title, category, description, startsAt, venueId, premiumPrice, standardPrice]
    EventUpdate:
      type: object
      properties:
        title: { type: string }
        description: { type: string }
        startsAt: { type: string, format: date-time }
        premiumPrice: { type: number }
        standardPrice: { type: number }
    EventDetail:
      allOf:
        - { $ref: "#/components/schemas/Event" }
        - type: object
          properties:
            organiser: { $ref: "#/components/schemas/User" }
    EventSeat:
      allOf:
        - { $ref: "#/components/schemas/Seat" }
        - type: object
          properties:
            status: { type: string, enum: [AVAILABLE, HELD, BOOKED, OFFERED] }
            heldUntil: { type: ["string", "null"], format: date-time }
            eventSeatId: { type: string, format: uuid }
          required: [status, eventSeatId]
    HoldInput:
      type: object
      properties:
        seatIds:
          type: array
          minItems: 1
          maxItems: 8
          items: { type: string, format: uuid }
      required: [seatIds]
    Hold:
      type: object
      properties:
        id: { type: string, format: uuid }
        eventId: { type: string, format: uuid }
        seatIds:
          type: array
          items: { type: string, format: uuid }
        expiresAt: { type: string, format: date-time }
        total: { type: number }
      required: [id, eventId, seatIds, expiresAt, total]
    Booking:
      type: object
      properties:
        id: { type: string, format: uuid }
        reference: { type: string }
        status: { type: string, enum: [CONFIRMED, CANCELLED] }
        total: { type: number }
        createdAt: { type: string, format: date-time }
        customer: { $ref: "#/components/schemas/User" }
        event: { $ref: "#/components/schemas/Event" }
        seats:
          type: array
          items: { $ref: "#/components/schemas/Seat" }
        qrData: { type: string }
      required: [id, reference, status, total, createdAt, event, seats, qrData]
    WaitlistInput:
      type: object
      properties:
        eventId: { type: string, format: uuid }
        category: { type: string, enum: [PREMIUM, STANDARD] }
      required: [eventId, category]
    WaitlistEntry:
      type: object
      properties:
        id: { type: string, format: uuid }
        event: { $ref: "#/components/schemas/Event" }
        category: { type: string, enum: [PREMIUM, STANDARD] }
        position: { type: integer }
        status: { type: string, enum: [WAITING, OFFERED, FULFILLED, REMOVED] }
        offer: { $ref: "#/components/schemas/WaitlistOffer" }
      required: [id, event, category, position, status]
    WaitlistOffer:
      type: object
      properties:
        id: { type: string, format: uuid }
        eventId: { type: string, format: uuid }
        seatId: { type: string, format: uuid }
        expiresAt: { type: string, format: date-time }
        status: { type: string, enum: [PENDING, ACCEPTED, EXPIRED] }
        event: { $ref: "#/components/schemas/Event" }
        seat: { $ref: "#/components/schemas/Seat" }
      required: [id, eventId, seatId, expiresAt, status]
    Analytics:
      type: object
      properties:
        totalEvents: { type: integer }
        totalBookings: { type: integer }
        revenue: { type: number }
        occupancy: { type: number }
        recentBookings:
          type: array
          items: { $ref: "#/components/schemas/Booking" }
      required: [totalEvents, totalBookings, revenue, occupancy, recentBookings]